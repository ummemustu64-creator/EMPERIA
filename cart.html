<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — EMPERIA LED</title><link rel="stylesheet" href="styles.css"></head><body class="cart-page">
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="home.html" data-brand>EMPERIA LED</a><nav class="site-nav"><a href="home.html">Home</a><a href="collection.html">Collection</a><a href="applications.html">Applications</a><a href="projects.html">Projects</a><a href="about.html">About Us</a><a href="catalogue.html">Catalogue</a><a href="contact.html">Contact</a><a class="nav-cta" href="contact.html">Request a Quote</a></nav><button class="menu-toggle">☰</button></div></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">Your selection</p><h1>Cart & Order</h1><p>Review your products and submit an order request. A sales representative can confirm pricing, availability and delivery.</p></div></section>
<section class="section"><div class="container"><div id="cartRoot"></div></div></section></main>
<footer class="footer"><div class="container footer-bottom"><span>© <span data-year></span> EMPERIA LED</span><span><a href="contact.html">Contact sales →</a></span></div></footer>
<script src="shared.js"></script><script>
let cart=[];
function readCart(){try{return JSON.parse(localStorage.getItem('emperia_cart')||'[]')}catch{return[]}}
function saveCart(){localStorage.setItem('emperia_cart',JSON.stringify(cart));updateCartCount()}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function updateCartCount(){document.querySelectorAll('[data-cart-count]').forEach(e=>e.textContent=cart.reduce((n,x)=>n+Number(x.quantity||0),0))}
function addHeaderCart(){const nav=document.querySelector('.site-nav');if(nav&&!nav.querySelector('[data-cart-link]')){const a=document.createElement('a');a.href='cart.html';a.dataset.cartLink='';a.innerHTML='Cart (<span data-cart-count>0</span>)';nav.appendChild(a)}updateCartCount()}
function render(){cart=readCart();addHeaderCart();const root=document.getElementById('cartRoot');if(!cart.length){root.innerHTML='<div class="panel cart-panel" style="padding:40px;text-align:center"><h2>Your cart is empty</h2><p class="muted">Add products from the collection to start an order.</p><a class="btn dark" href="collection.html">Browse collection</a></div>';return}
const subtotal=cart.reduce((n,x)=>n+Number(x.unitPrice||0)*Number(x.quantity||0),0);
root.innerHTML=`<div class="two"><div class="panel cart-panel"><div class="panel-head"><div><h2>Your products</h2><p class="muted">${cart.length} product line${cart.length===1?'':'s'}</p></div><button class="btn light" onclick="clearCart()">Clear cart</button></div>${cart.map((x,i)=>`<div class="cart-line"><img src="${imgSrc(x.image)}" alt="${esc(x.name)}"><div class="cart-main"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.sku||'')}</p><div class="cart-controls"><label>Qty <input type="number" min="1" value="${x.quantity}" onchange="setQty(${i},this.value)"></label><button class="btn light" onclick="removeItem(${i})">Remove</button></div></div><div class="cart-price">${Number(x.unitPrice)>0?money(Number(x.unitPrice)*Number(x.quantity)):'Price on request'}</div></div>`).join('')}</div>
<div class="panel cart-panel"><h2>Customer & order details</h2><p class="muted">Submit this as an order request. Our team will confirm final commercial terms.</p><form id="orderForm" class="form-grid"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Company</label><input name="company"></div><div class="field"><label>Phone *</label><input name="phone" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field full"><label>Delivery address</label><textarea name="address" rows="3"></textarea></div><div class="field"><label>Preferred payment</label><select name="paymentMethod"><option>To be confirmed</option><option>Bank transfer</option><option>Credit / debit card</option><option>UPI</option><option>Cash on delivery</option></select></div><div class="field"><label>Notes</label><input name="notes"></div><div class="field full"><div class="order-total"><span>Order total</span><strong>${subtotal>0?money(subtotal):'To be confirmed'}</strong></div></div><div class="field full"><button class="btn dark" type="submit">Place order request</button></div></form><div id="orderResult"></div></div></div>`;
document.getElementById('orderForm').addEventListener('submit',submitOrder)}
async function submitOrder(e){e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());body.items=cart.map(x=>({productId:x.productId,quantity:Number(x.quantity)}));try{const r=await getJSON('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});localStorage.removeItem('emperia_cart');cart=[];document.getElementById('cartRoot').innerHTML=`<div class="panel cart-panel" style="padding:45px;text-align:center"><p class="eyebrow">Order received</p><h2>Thank you. Your order request is ${esc(r.orderNo)}.</h2><p class="muted">We have recorded all order details. Our sales team will contact you to confirm pricing, availability, payment and delivery.</p><div class="row" style="justify-content:center"><a class="btn dark" href="collection.html">Continue shopping</a><a class="btn light" href="home.html">Back home</a></div></div>`;updateCartCount()}catch(err){document.getElementById('orderResult').innerHTML='<p class="danger">'+esc(err.message)+'</p>'}}
function setQty(i,v){cart[i].quantity=Math.max(1,Number(v)||1);saveCart();render()}
function removeItem(i){cart.splice(i,1);saveCart();render()}
function clearCart(){cart=[];saveCart();render()}
render();
</script></body></html>
