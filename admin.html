<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPERIA LED — Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="login-wrap"><div class="login-card"><div class="brand">EMPERIA LED</div><p class="muted">Business administration</p><div class="field"><label>Email (optional for master admin)</label><input id="email" type="email" placeholder="name@company.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password"></div><button class="btn fullbtn" onclick="login()">Sign in</button><button class="show-pass" onclick="togglePassword()">Show password</button><p id="loginError" class="danger"></p><p class="muted small">Local master password uses ADMIN_PASSWORD (default: admin123). Change it before production.</p></div></div>
<div id="app" class="admin-shell hidden"><aside class="side"><div class="brand">EMPERIA LED</div><p>Business administration</p><nav>
<div class="nav-label">Overview</div><button class="active" data-section="dashboard">Dashboard</button>
<div class="nav-label">Sales</div><button data-section="enquiries">Leads / Enquiries</button><button data-section="customers">Customers</button><button data-section="quotes">Quotes</button><button data-section="orders">Orders</button><button data-section="analytics">Sales Analytics</button>
<div class="nav-label">Catalogue</div><button data-section="products">Products</button><button data-section="inventory">Inventory</button><button data-section="projects">Projects</button>
<div class="nav-label">Website</div><button data-section="media">Media Library</button><button data-section="catalogue">Catalogue PDF</button><button data-section="settings">Website Content</button>
<div class="nav-label">System</div><button data-section="activity">Activity Log</button><button data-section="users">Users & Permissions</button>
<a href="home.html" target="_blank">View website ↗</a><button onclick="logout()">Log out</button></nav></aside>
<main class="main"><div class="top"><div><p class="eyebrow">EMPERIA LED ADMIN</p><h1 id="title">Dashboard</h1><p id="userBadge" class="muted"></p></div><div class="row"><input id="globalSearch" class="top-search" placeholder="Search products, customers, orders…" onkeydown="if(event.key==='Enter')globalSearch()"><button class="btn light" onclick="refreshAll()">Refresh</button><button class="btn" onclick="quickEnquiry()">+ New Lead</button></div></div>
<section id="dashboard" class="section"></section><section id="enquiries" class="section hidden"></section><section id="customers" class="section hidden"></section><section id="quotes" class="section hidden"></section><section id="orders" class="section hidden"></section><section id="analytics" class="section hidden"></section><section id="products" class="section hidden"></section><section id="inventory" class="section hidden"></section><section id="projects" class="section hidden"></section><section id="media" class="section hidden"></section><section id="catalogue" class="section hidden"></section><section id="settings" class="section hidden"></section><section id="activity" class="section hidden"></section><section id="users" class="section hidden"></section></main></div><div id="toast" class="toast"></div><script src="admin.js"></script></body></html>
