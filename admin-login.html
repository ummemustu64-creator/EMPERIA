<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPERIA LED — Admin Login</title><link rel="stylesheet" href="admin.css"></head><body><div class="login-wrap"><div class="login-card"><div class="brand">EMPERIA LED</div><p class="muted">Business administration</p><div class="field"><label>Email (optional for master admin)</label><input id="email" type="email" placeholder="name@company.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password"></div><button class="btn fullbtn" onclick="login()">Sign in</button><button class="show-pass" onclick="togglePassword()">Show password</button><p id="loginError" class="danger"></p><p class="muted small">Default local master password: <b>admin123</b>. Change ADMIN_PASSWORD before production.</p></div></div><script>const password=document.getElementById('password');function togglePassword(){password.type=password.type==='password'?'text':'password'}async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:password.value})});const j=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('loginError').textContent=j.error||'Login failed';return}localStorage.setItem('emperiaAdminToken',j.token);localStorage.setItem('emperiaAdminUser',JSON.stringify(j.user||null));location.href='admin.html'}password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(localStorage.getItem('emperiaAdminToken'))location.href='admin.html';</script></body></html>
