<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects — EMPERIA LED</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="home.html" data-brand>EMPERIA LED</a><nav class="site-nav"><a href="home.html">Home</a><a href="collection.html">Collection</a><a href="applications.html">Applications</a><a href="projects.html">Projects</a><a href="about.html">About Us</a><a href="catalogue.html">Catalogue</a><a href="contact.html">Contact</a><a class="nav-cta" href="contact.html">Request a Quote</a></nav><button class="menu-toggle">☰</button></div></header><main><section class="page-hero"><div class="container"><p class="eyebrow">In context</p><h1>Projects</h1><p>See lighting through the environments it helps shape. Project content can be expanded from the admin panel as the portfolio grows.</p></div></section><section class="section" style="padding-top:15px"><div class="container"><div id="projects" class="projects-grid"></div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© <span data-year></span> EMPERIA LED</span><span><a href="contact.html">Start a project enquiry →</a></span></div></footer><script src="shared.js"></script><script>Promise.all([loadSettings(),getJSON('/api/projects')]).then(([s,projects])=>{setupNav(s);footer(s);const fallback=[{name:'Architectural Staircase',type:'Hospitality / Interior',location:'Portfolio reference',description:'A warm architectural lighting environment using decorative and concealed lighting.',images:['/assets/projects/hero-architectural.jpg']},{name:'Pool & Water Feature',type:'Outdoor / Underwater',location:'Portfolio reference',description:'Underwater lighting used to bring colour and depth to a water environment.',images:['/assets/projects/pool-project.jpg']}];const items=projects.length?projects:fallback;document.getElementBy
